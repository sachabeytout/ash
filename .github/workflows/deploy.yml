name: Vérifier et déployer

# Deux versions sont servies (décision du 05/11/2026) :
# - le jeu public, sous /<dépôt>/, construit depuis la branche main ;
# - la version de test, sous /<dépôt>/test/, construite depuis la branche test (sauvegarde séparée).
# Un envoi sur test ne lance que les vérifications. La mise en ligne passe toujours par main (envoi sur main, ou
# lancement manuel sur main) : elle reconstruit les deux versions, car GitHub Pages publie le site en entier.
on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Captures pour déboguer : une panne du service d'artefacts de GitHub ne doit pas bloquer la mise en ligne.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: captures
          path: tests/e2e/screenshots
          if-no-files-found: ignore

  site:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: main-src
      - name: La branche test existe-t-elle ?
        id: test-branch
        run: |
          if git -C main-src ls-remote --exit-code --heads origin test > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.test-branch.outputs.exists == 'true'
        with:
          ref: test
          path: test-src
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Jeu public
        working-directory: main-src
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm ci && npm run build
      - name: Version de test
        if: steps.test-branch.outputs.exists == 'true'
        working-directory: test-src
        env:
          BASE_PATH: /${{ github.event.repository.name }}/test/
          APP_CHANNEL: test
        run: npm ci && npm run build
      - name: Assembler le site
        run: |
          mkdir -p site
          cp -r main-src/dist/. site/
          if [ -d test-src/dist ]; then
            mkdir -p site/test
            cp -r test-src/dist/. site/test/
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
